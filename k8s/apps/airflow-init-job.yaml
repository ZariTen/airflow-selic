apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
spec:
  template:
    spec:
      securityContext:
        runAsUser: 0
      containers:
      - name: init
        image: meu-airflow:local
        imagePullPolicy: Never
        command: ["/bin/bash", "-c", "/entrypoint airflow db migrate && /entrypoint airflow version"]
        envFrom:
        - configMapRef:
            name: airflow-config
      restartPolicy: OnFailure
