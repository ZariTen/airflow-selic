apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-api-server
  template:
    metadata:
      labels:
        app: airflow-api-server
    spec:
      securityContext:
        runAsUser: 50000
        fsGroup: 0
      containers:
      - name: api-server
        image: meu-airflow:local
        imagePullPolicy: Never
        args: ["api-server"]
        envFrom:
        - configMapRef:
            name: airflow-config
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: airflow-arquivos
          mountPath: /opt/airflow/dags
          subPath: dags
        - name: airflow-arquivos
          mountPath: /opt/airflow/src
          subPath: src
        - name: airflow-arquivos
          mountPath: /opt/airflow/logs
          subPath: logs
      volumes:
      - name: airflow-arquivos
        hostPath:
          path: /files
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-api-service
spec:
  type: NodePort
  selector:
    app: airflow-api-server
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
